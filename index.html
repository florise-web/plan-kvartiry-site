<style>

:root{

.stage.m-3d #plan,.stage.m-3d .zoombox,.stage.m-3d .hint{display:none}

"r\": 0, \"n\": \"Решётка вытяжки (короб в шахту)\", \"m\": 240, \"note\": \"Короб над шкафами, обратный клапан.\"}, {\"id\": \"c8\", \"t\": \"vent\", \"x\": 164, \"y\": 254, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Естественная вентиляция кухни\", \"m\": 240, \"note\": \"Решётка естественной вентиляции на шахте, h 240. Шкаф над мойкой — до 225, решётку не закрывать.\"}, {\"id\": \"c9\", \"t\": \"rad\", \"x\": 80, \"y\": 655, \"w\": 120, \"h\": 10, \"r\": 0, \"n\": \"Радиатор под окном (кухня)\", \"note\": \"\"}, {\"id\": \"c10\", \"t\": \"rad\", \"x\": 380, \"y\": 655, \"w\": 120, \"h\": 10, \"r\": 0, \"n\": \"Радиатор под окном (кабинет)\", \"note\": \"Стол стоит над радиатором — нужен зазор/вырез в столешнице.\"}, {\"id\": \"c11\", \"t\": \"hvs\", \"x\": 17, \"y\": 2, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Стиралка: ХВС + кран\", \"m\": 60, \"note\": \"\"}, {\"id\": \"c12\", \"t\": \"kan\", \"x\": 37, \"y\": 4, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Стиралка: слив Ø40 через обратный клапан\", \"m\": 60, \"note\": \"\"}, {\"id\": \"c13\", \"t\": \"hvs\", \"x\": 74, \"y\": 2, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Раковина: ХВС\", \"m\": 55, \"note\": \"\"}, {\"id\": \"c14\", \"t\": \"gvs\", \"x\": 90, \"y\": 2, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Раковина: ГВС\", \"m\": 55, \"note\": \"\"}, {\"id\": \"c15\", \"t\": \"kan\", \"x\": 82, \"y\": 16, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Раковина: канализация Ø40\", \"m\": 50, \"note\": \"\"}, {\"id\": \"c16\", \"t\": \"hvs\", \"x\": 30, \"y\": 190, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Душ: смеситель ХВС\", \"m\": 110, \"note\": \"Скрытый смеситель на стене со стороны шахты (не на наружной стене).\"}, {\"id\": \"c17\", \"t\": \"gvs\", \"x\": 44, \"y\": 190, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Душ: смеситель ГВС\", \"m\": 110, \"note\": \"\"}, {\"id\": \"c18\", \"t\": \"trap\", \"x\": 70, \"y\": 184, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Слив душа (угол у стояка)\", \"m\": null, \"note\": \"Слив в углу душа, ближайшем к стояку: до стояка ~70 см, перепад 1,4 см. Под поддон: низкий поддон 4 см + низкий сифон 6–8 см → верх поддона ≈ 12–13 см от пола, одна ступенька. Вентшахта остаётся на месте и душ 90×90 не задевает.\"}, {\"id\": \"c19\", \"t\": \"kan\", \"x\": 131, \"y\": 190, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Унитаз: канализация Ø110\", \"m\": 23, \"note\": \"\"}, {\"id\": \"c20\", \"t\": \"hvs\", \"x\": 118, \"y\": 190, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Унитаз: ХВС в бачок инсталляции\", \"m\": 80, \"note\": \"\"}, {\"id\": \"c21\", \"t\": \"meter\", \"x\": 160, \"y\": 188, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Счётчики, краны, фильтры, аквастоп\", \"m\": null, \"note\": \"Ревизионный люк обязателен. Если узел учёта в шахте за холодильником — оставить люк в панели.\"}, {\"id\": \"c22\", \"t\": \"fan\", \"x\": 142, \"y\": 200, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Вентилятор ванной в шахту\", \"m\": 230, \"note\": \"С обратным клапаном и таймером.\"}, {\"id\": \"c23\", \"t\": \"leak\", \"x\": 117, \"y\": 294, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Датчик протечки под мойкой\", \"m\": null, \"note\": \"Связан с кранами аквастоп.\"}, {\"id\": \"c24\", \"t\": \"leak\", \"x\": 44, \"y\": 24, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Датчик протечки за стиралкой\", \"m\": null, \"note\": \"\"}, {\"id\": \"c25\", \"t\": \"leak\", \"x\": 152, \"y\": 170, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Датчик протечки у узла учёта\", \"m\": null, \"note\": \"\"}, {\"id\": \"c26\", \"t\": \"router\", \"x\": 424, \"y\": 116, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Модем / роутер\", \"m\": 30, \"note\": \"Интернет заводят в прихожую → гардероб. Wi-Fi покрывает всю квартиру.\"}, {\"id\": \"dmw5g4fje1\", \"t\": \"desk\", \"x\": 332, \"y\": 600, \"w\": 120, \"h\": 60, \"r\": 2, \"n\": \"Стол Г: часть у окна 120×60\", \"note\": \"Стоит над радиатором — это нормально, если между столешницей и окном щель 10 см: тёплый воздух поднимается к окну. Столешница на 75 см, радиатор ниже.\"}, {\"id\": \"rmw5g54nj2\", \"t\": \"round\", \"x\": 468, \"y\": 588, \"w\": 36, \"h\": 36, \"r\": 0, \"n\": \"Столик-пень\", \"note\": \"\"}, {\"id\": \"smw5g5ph33\", \"t\": \"shelf\", \"x\": 542, \"y\": 55, \"w\": 40, \"h\": 150, \"r\": 1, \"n\": \"Полки и ящики 80×40\", \"note\": \"Сужены до 40 см, чтобы не заходить в проём двери из спальни.\"}, {\"id\": \"e7\", \"t\": \"outlet2\", \"x\": 12, \"y\": 216, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Кладовая: аэрогриль\", \"m\": 95, \"note\": \"Над рабочей полкой h 85–90 (глубина 50, жаростойкая столешница). Аэрогриль ~2 кВт — отдельная линия 16 А на кладовую.\"}, {\"id\": \"e7b\", \"t\": \"outlet2\", \"x\": 34, \"y\": 216, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Кладовая: микроволновка + чайник\", \"m\": 95, \"note\": \"На той же полке. Аэрогриль и микроволновку лучше не включать одновременно с чайником — линия 16 А ≈ 3,5 кВт.\"}, {\"id\": \"e7c\", \"t\": \"outlet\", \"x\": 56, \"y\": 216, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Кладовая: пылесос / зарядка\", \"m\": 30, \"note\": \"Внизу, под полками — станция пылесоса или аккумуляторный пылесос.\"}, {\"id\": \"e8\", \"t\": \"outlet\", \"x\": 1, \"y\": 239, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Кладовая: LED + вентилятор\", \"m\": 210, \"note\": \"Подсветка по датчику двери и маленький вентилятор, который включается вместе со светом.\"}, {\"id\": \"c27\", \"t\": \"vent\", \"x\": 57, \"y\": 262, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Вентиляция кладовой\", \"m\": 220, \"note\": \"Аэрогриль и микроволновка отдают тепло и пар: решётка в верхней части двери или щель 2–3 см под потолком. Аэрогриль — с отступом 10–15 см от стенок, готовить с открытой дверью или с вентилятором.\"}, {\"id\": \"l30\", \"t\": \"sconce\", \"x\": 197, \"y\": 74, \"w\": 16, \"h\": 16, \"r\": 0, \"n\": \"Бра у зеркала\", \"sc\": [\"guests\", \"hygge\", \"cook\"], \"note\": \"Свет на лицо, а не в спину: сбоку от зеркала на высоте ~160.\"}, {\"id\": \"sofashelf\", \"t async function cloudWrite(){

function ray(b,dir,ex){

      if(dir==='R'&&o.x>=b.x+b.w-.5)best=Math.min(best,o.x-(b.x+b.w));
      if(dir==='L'&&o.x+o.w<=b.x+.5)best=Math.min(best,b.x-(o.x+o.w));
    } else { if(!(o.x<b.x+b.w-1&&o.x+o.w>b.x+1))continue;
      if(dir==='D'&&o.y>=b.y+b.h-.5)best=Math.min(best,o.y-(b.y+b.h));
      if(dir==='U'&&o.y+o.h<=b.y+.5)best=Math.min(best,b.y-(o.y+o.h));

}

  const tv=g('tv');if(tv&&sf){const d=sf.x-(tv.x+tv.w);const a=rnd(d/1.5/2.54),b=rnd(d/1.2/2.54);M('Диван → телевизор',`${rnd(d)} см`,'info',`Для 4K оптимальная диагональ ≈ ${a}–${b}″.`,['tv','sofa'])}
  const bs=g('basin'),sh=g('shower');if(bs){const d=ray(bs,'D');if(d!=null)M('Ванная: место перед раковиной',`${rnd(d)} см`,d>=70?'ok':d>=60?'warn':'bad','Норма ≥70 см, чтобы стоять и наклоняться.',['basin'])}
  const wc=g('toilet');if(wc){const l=ray(wc,'L'),r=ray(wc,'R');const ax=Math.min(l??99,r??99)+wc.w/2;M('Унитаз: от оси до препятствия',`${rnd(ax)} см`,ax>=38?'ok':ax>=30?'warn':'bad','Комфорт ≥38 см с каждой стороны от оси, минимум 30.',['toilet']);
    const fdir=['D','L','U','R'][wc.r%4];const f=ray(wc,fdir);if(f!=null)M('Унитаз: свободно перед ним',`${rnd(f)} см`,f>=60?'ok':f>=50?'warn':'bad','Норма ≥60 см.',['toilet'])}

function issues(){
  const out=[]; const F=solidItems(null);
  const SM=new Set(['chair','stool','night','plant','round','toilet']);
  for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++){const a=F[i],b=F[j];
    const TUCK=new Set(['chair','stool']),TAB=new Set(['table','steptable','desk','round']);
    if((TUCK.has(a.t)&&TAB.has(b.t))||(TUCK.has(b.t)&&TAB.has(a.t)))continue;
    if(inter(a,b)>4){out.push({lvl:'bad',t:`«${a.n}» и «${b.n}» пересекаются`,ids:[a.id,b.id],box:[Math.max(a.x,b.x),Math.max(a.y,b.y),Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y)]});continue}
    if(SM.has(a.t)||SM.has(b.t))continue;
    if(roomOfStrict(...ctr(a))!==roomOfStrict(...ctr(b)))continue;
    const {dx,dy}=gapXY(a,b);
    const ovY=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y), ovX=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x);
    let g=null,line=null;
    if(dx>20&&dx<60&&ovY>10){g=dx;const y=Math.max(a.y,b.y)+ovY/2;const x1=Math.min(a.x+a.w,b.x+b.w),x2=Math.max(a.x,b.x);line=[x1,y,x2,y]}
    else if(dy>20&&dy<60&&ovX>10){g=dy;const x=Math.max(a.x,b.x)+ovX/2;const y1=Math.min(a.y+a.h,b.y+b.h),y2=Math.max(a.y,b.y);line=[x,y1,x,y2]}
    if(g!=null){const gx=Math.min(line[0],line[2])-1,gy=Math.min(line[1],line[3])-1;const gz={x:gx,y:gy,w:Math.abs(line[2]-line[0])+2,h:Math.abs(line[3]-line[1])+2};if(F.some(o=>o!==a&&o!==b&&inter(gz,o)>0))g=null}
    if(g!=null)out.push({lvl:'warn',t:`Узко между «${a.n}» и «${b.n}»: ${rnd(g)} см (проход ≥ 60)`,ids:[a.id,b.id],line,g});
  }
  // мебель заходит в стену / за пределы квартиры
  F.forEach(f=>{const hit=WALLS.find(w=>inter(f,w)>4);if(hit)out.push({lvl:'bad',t:`«${f.n}» заходит в ${hit.k==='shaft'?'вентшахту':hit.k==='glass'?'стеклянную перегородку':'стену'} — не поместится`,ids:[f.id],box:[Math.max(f.x,hit.x),Math.max(f.y,hit.y),Math.min(f.x+f.w,hit.x+hit.w)-Math.max(f.x,hit.x),Math.min(f.y+f.h,hit.y+hit.h)-Math.max(f.y,hit.y)]});
    else if(!roomOfStrict(...ctr(f))||f.x<-1||f.y<-1||f.x+f.w>583||f.y+f.h>671)out.push({lvl:'bad',t:`«${f.n}» за пределами квартиры`,ids:[f.id]})});
  // радиаторы
  const ABOVE=new Set(['desk','table','steptable','chair','stool','round']);
  st.items.filter(i=>i.t==='rad').forEach(r=>{const z={x:r.x-5,y:r.y-12,w:r.w+10,h:r.h+17};F.forEach(f=>{if(ABOVE.has(f.t))return;if(inter(z,f)>4)out.push({lvl:'warn',t:`«${f.n}» закрывает радиатор — оставьте зазор ≥10 см или вырез в столешнице`,ids:[f.id,r.id]})})});
  // розетки у мойки и в ванной
  const sinks=st.items.filter(i=>i.t==='sink'||i.t==='basin');
  st.items.filter(i=>layerOf(i)==='elec'&&!TYPES[i.t].sw).forEach(o=>{sinks.forEach(s=>{const d=dist(ctr(o),ctr(s));if(d<50&&(o.m??0)<=120&&s.t==='sink')out.push({lvl:'warn',t:`Розетка «${o.n}» в ${rnd(d)} см от мойки — лучше ≥50–60 см`,ids:[o.id,s.id]})})});
  st.items.filter(i=>layerOf(i)==='elec'&&!TYPES[i.t].sw).forEach(o=>{const sh=st.items.filter(i=>i.t==='shower');sh.forEach(s=>{const c=ctr(o);if(roomOfStrict(...c)!==roomOfStrict(...ctr(s)))return;const dx=Math.max(s.x-c[0],c[0]-(s.x+s.w),0),dy=Math.max(s.y-c[1],c[1]-(s.y+s.h),0);if(Math.hypot(dx,dy)<60)out.push({lvl:'bad',t:`Розетка «${o.n}» ближе 60 см к душу — нельзя (зона 1–2)`,ids:[o.id,s.id]})})});
  return out;
}

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!inField()){e.preventDefault();redo();return}
  if(inField())return;
  const sel=ui.sel&&byId(ui.sel);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'&&sel){e.preventDefault();duplicate(sel);return}
  if(e.key==='Escape'){if(ui.draft){finishPipe();return}ui.sel=null;render();refreshSide();return}
  if(e.key==='Enter'&&ui.draft){finishPipe();return}

  if(sel&&e.key.startsWith('Arrow')){const d=e.shiftKey?10:1;if(e.key==='ArrowLeft')sel.x-=d;if(e.key==='ArrowRight')sel.x+=d;if(e.key==='ArrowUp')sel.y-=d;if(e.key==='ArrowDown')sel.y+=d;e.preventDefault();render();clearTimeout(window.__kt);window.__kt=setTimeout(()=>{commit()},300);return}

  const map={v:'select',м:'select',p:'pen',з:'pen',m:'measure',ь:'measure',l:'pipe',д:'pipe',t:'text',е:'text',e:'erase',у:'erase'};

});

function paneIdea(){
  pane.innerHTML=`<h3>Почему план устроен так</h3>
  <h4>Кухня-гостиная</h4><ul class="logic">
  <li><b>Угловая кладовая как на видео</b> — в верхнем левом углу, между наружной стеной и шахтой. Это «мёртвый» угол, а в нём помещаются микроволновка, кофемашина, запасы и пылесос. Дверь по диагонали, внутри свет по датчику.</li>
  <li><b>Мойка перед шахтой</b>, стояки прямо за ней — самые короткие трубы. <b>Холодильник в высокой колонне</b> у стены спальни вместе с пеналом-карго 30. От угла мойки до колонны 71 см — проход из прихожей свободный.</li>
  <li><b>Плита на 2 конфорки с духовкой 60 под ней.</b> Мойка 60 + посудомойка 45 + модуль плиты 60 ровно доходят до полуострова.</li>
  <li><b>Полуостров 40 см, длина 115</b> — чёткая граница кухни и гостиной, но не «вылезает» к дивану: до дивана 70 см. За диваном — узкая консоль 10 см высотой 69 под растения и лампы.</li>
  <li><b>Кладовая — техническое сердце кухни:</b> рабочая полка на высоте 85–90 под аэрогриль и микроволновку, три розеточных блока на отдельной линии, вентиляция в двери. Техника не занимает столешницу и не стоит на виду.</li>
  <li><b>ПММ → плита</b> по левой стене, рядом с мойкой. Рабочий треугольник ~5 м.</li>
  <li><b>Полуостров со столом-ступенькой, как на картинке.</b> Со стороны кухни — рабочая столешница 90 см, к гостиной — стол 75 см для гостей на обычных стульях. Он же отделяет кухню от зоны дивана. Подсветка под свесом и подвесы над столом.</li>
  <li><b>Гостиная в духе видео (хюгге):</b> диван у несущей стены, ТВ на кронштейне напротив, у окна пень-столик, растения и гирлянда. Тёплый свет из многих точек вместо одной люстры — смотрите сценарий «Хюгге-вечер».</li></ul>
  <h4>Ванная</h4><ul class="logic">
  <li>Душ 90×90 вместо ванны, общая столешница с узкой стиралкой и раковиной, как в вашем PDF.</li>
  <li><b>Что я поменяла:</b> унитаз стоит у стены с шахтой, рядом со стояком. В PDF он у дальней стены — тогда труба Ø110 идёт ~2,7 м мимо двери, нужен подиум. Перетащите его обратно, если хотите: проверка покажет уклон.</li>
  <li>Место у раковины — 70 см, проход к унитазу свободный.</li></ul>
  <h4>Прихожая</h4><ul class="logic">
  <li>По техплану прихожая 200×205 — тянется до стены кухни и спальни. Двери в кухню и в спальню выходят из её нижней части.</li>
  <li><b>Два зеркала в рост:</b> на стене ванной у входа (с бра сбоку) и зеркальная дверь-купе гардероба напротив — прихожая визуально в два раза шире.</li>
  <li>Обувница-банкетка на 45 см, над ней выключатель «выключить всё», рядом домофон и щиток.</li></ul>
  <h4>Спальня и кабинет</h4><ul class="logic">
  <li>Спальня по техплану буквой Г: под гардеробом ниша 175×70 (отсюда 14,1 м² у застройщика). В эту нишу встала кровать 160×200 изголовьем к гардеробу (ниша 175, запасной вариант — 140 с тумбой) — у двери освободилось место под комод и ТВ, до стекла от изножья 100 см. В гардероб заходим из прихожей через зеркальную дверь-купе. Двойные розетки + выключатели у обеих тумб.</li>
  <li>Стеклянная перегородка с раздвижной дверью пропускает свет в спальню. В кабинете стол у окна, а напротив угол для рилс: кресло, стеллаж с подсветкой, штатив с отдельной розеткой.</li></ul>
  <h4>Как пользоваться</h4><ul class="logic">
  <li><b>3D</b> — кнопки 2D / 3D / 2D + 3D сверху. Двигаете мебель в 2D, 3D обновляется сам. Выберите сценарий света — увидите вечернюю квартиру.</li>
  <li><b>Двигать</b> — тяните мебель, она прилипает к стенам. Пустое место — двигать план.</li>
  <li><b>Карандаш</b> — рисуйте от руки, <b>Линейка</b> — любые замеры, <b>Заметка</b> — подписи.</li>

  <li><b>Проверки</b> — живой список расстояний и узких мест.</li></ul>`;
}

  if(it.t==='chair'){box3(x0+3,y0+3,x1-3,y1-3,42,46,'wood');[[x0+4,y0+4],[x1-7,y0+4],[x0+4,y1-7],[x1-7,y1-7]].forEach(([a,b])=>box3(a,b,a+3,b+3,0,42,'wood'));const b=backStrip(it,5);box3(b[0],b[1],b[2],b[3],46,85,'wood');return}
  if(['steptable','table','desk'].includes(it.t)){box3(x0,y0,x1,y1,z1-4,z1,'wood');[[x0+3,y0+3],[x1-7,y0+3],[x0+3,y1-7],[x1-7,y1-7]].forEach(([a,b])=>box3(a,b,a+4,b+4,0,z1-4,'dark'));return}
  if(it.t==='round'){cyl3((x0+x1)/2,(y0+y1)/2,Math.min(it.w,it.h)/2,0,z1,'wood');return}
  if(it.t==='plant'){cyl3((x0+x1)/2,(y0+y1)/2,Math.min(it.w,it.h)*.28,0,35,'white');const g=new THREE.SphereGeometry(Math.min(it.w,it.h)*.55,14,10);const m=new THREE.Mesh(g,mat('plant'));m.position.set((x0+x1)/2,75,(y0+y1)/2);m.castShadow=true;V3.root.add(m);return}
  if(it.t==='toilet'){const b=backStrip(it,13);box3(b[0],b[1],b[2],b[3],0,110,'white');box3(x0,y0,x1,y1,25,42,'white');return}
  if(['cab','sink','hob','hob2','dw','basin','washer'].includes(it.t)){box3(x0,y0,x1,y1,10,z1-4,it.t==='dw'||it.t==='washer'?'appl':(it.id==='pen'?'wood':'white'));box3(x0,y0,x1,y1,z1-4,z1,it.t==='basin'||it.t==='washer'?'white':'dark');if(it.t==='sink'||it.t==='basin'){const c=ctr(it);cyl3(c[0],c[1],Math.min(it.w,it.h)*.25,z1,z1+.6,'appl')}if(it.t==='hob'||it.t==='hob2'){const c=ctr(it);box3(c[0]-22,c[1]-22,c[0]+22,c[1]+22,z1,z1+.8,'dark')}return}
  if(it.t==='rug'){box3(x0,y0,x1,y1,0,1.2,'rug');return}
  box3(x0,y0,x1,y1,z0,z1,mk);
}
function build3D(){
  if(!init3D())return;
  const R=V3.root;while(R.children.length){const c=R.children.pop();c.geometry&&c.geometry.dispose()}
  while(V3.lights.children.length)V3.lights.remove(V3.lights.children[0]);
  const WH=V3.low?120:270;
  ROOMS.forEach(r=>r.rects.forEach(q=>{const mk=r.fl==='fl-t'?'floorT':r.fl==='fl-w2'?'floorW2':'floorW';const g=new THREE.PlaneGeometry(q[2],q[3]);const m=new THREE.Mesh(g,mat(mk));m.rotation.x=-Math.PI/2;m.position.set(q[0]+q[2]/2,0,q[1]+q[3]/2);m.receiveShadow=true;R.add(m)}));
  {const g=new THREE.PlaneGeometry(1600,1600);const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0xBFB9AE}));m.rotation.x=-Math.PI/2;m.position.set(291,-1,335);m.receiveShadow=true;R.add(m)}
  WALLS.forEach(w=>{
    const mk=w.k==='glass'?'glass':w.k==='shaft'?'shaft':w.k==='wallb'?'wallb':'wall';
    if(w.k==='slide'){box3(w.x,w.y+2,w.x+w.w/2+3,w.y+5,0,Math.min(WH,250),'wood');box3(w.x+w.w/2-3,w.y+6,w.x+w.w,w.y+9,0,Math.min(WH,250),'wood');return}
    if(w.k==='curtain'){if(!M3.curtain)M3.curtain=new THREE.MeshLambertMaterial({color:0xE6DCC8,transparent:true,opacity:.88});const segs=12;for(let i=0;i<segs;i++){const x0=w.x+w.w*i/segs;box3(x0,w.y+(i%2?0:3),x0+w.w/segs,w.y+(i%2?3:6),3,Math.min(WH,265),'curtain')}return}
    if(w.k==='glass'){box3(w.x,w.y+1,w.x+w.w,w.y+w.h-1,0,Math.min(WH,250),'glass');box3(w.x,w.y+1,w.x+w.w,w.y+w.h-1,0,3,'dark');return}
    if(w.y>=669&&w.w>500){let cur=w.x;WIN3.forEach(([a,b])=>{box3(cur,w.y,a,w.y+w.h,0,WH,mk);box3(a,w.y,b,w.y+w.h,0,Math.min(90,WH),mk);if(WH>240)box3(a,w.y,b,w.y+w.h,240,WH,mk);box3(a,w.y+10,b,w.y+12,90,Math.min(240,WH),'glass');cur=b});box3(cur,w.y,w.x+w.w,w.y+w.h,0,WH,mk);return}
    box3(w.x,w.y,w.x+w.w,w.y+w.h,0,w.k==='shaft'?WH:WH,mk);
  });
  if(!V3.low)DOOR3f().forEach(d=>box3(d[0],d[1],d[2],d[3],215,270,d[3]-d[1]<=6?'glass':'wall'));
  st.items.forEach(item3);
  // свет
  const on=st.items.filter(i=>TYPES[i.t]&&TYPES[i.t].L==='light'&&(!ui.scene||(i.sc||[]).includes(ui.scene)));
  if(ui.scene){V3.hemi.intensity=.22;V3.sun.intensity=.08;V3.scene.background=new THREE.Color(0x1B1A17)}else{V3.hemi.intensity=.75;V3.sun.intensity=.65;V3.scene.background=new THREE.Color(getComputedStyle(document.body).getPropertyValue('--plan-bg').trim()||'#F3F2EC')}
  on.filter(i=>TYPES[i.t].pt).forEach(i=>{const [cx,cy]=ctr(i);const z={spot:262,pendant:175,ceiling:255,sconce:150,floorlamp:150,tlamp:70}[i.t]||200;const g=new THREE.SphereGeometry(i.t==='pendant'?9:i.t==='floorlamp'?11:4,12,8);const m=new THREE.Mesh(g,mat(ui.scene?'lampOn':'white'));m.position.set(cx,z,cy);R.add(m);if(i.t==='pendant'||i.t==='floorlamp'){const c=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,(i.t==='pendant'?270:150)-z+(i.t==='floorlamp'?z:0),4),mat('dark'));c.position.set(cx,i.t==='pendant'?(270+z)/2:z/2,cy);R.add(c)}});
  if(ui.scene){on.slice(0,14).forEach(i=>{const [cx,cy]=ctr(i);const p=new THREE.PointLight(0xffc27a,TYPES[i.t].strip?.55:.85,TYPES[i.t].strip?220:330,1.6);p.position.set(cx,TYPES[i.t].strip?140:200,cy);V3.lights.add(p)})}
  draw3D();
}
function draw3D(){if(!V3.inited||!V3.on)return;cancelAnimationFrame(V3.raf);V3.raf=requestAnimationFrame(()=>{const c=V3.cam;const d=V3.dist;c.position.set(V3.tx+d*Math.sin(V3.ph)*Math.cos(V3.th),d*Math.cos(V3.ph),V3.tz+d*Math.sin(V3.ph)*Math.sin(V3.th));c.lookAt(V3.tx,40,V3.tz);V3.ren.render(V3.scene,c)})}
function queue3D(){clearTimeout(V3.t);V3.t=setTimeout(build3D,act?160:40)}
function controls3D(el){
  const P=new Map();let mode=null,last=null,pd=0;
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});mode=(e.button===2||e.shiftKey)?'pan':'rot';if(P.size===2){const [a,b]=[...P.values()];pd=Math.hypot(a.x-b.x,a.y-b.y);mode='pinch'}last={x:e.clientX,y:e.clientY}});
  el.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(mode==='pinch'&&P.size>=2){const [a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pd){V3.dist=Math.min(2600,Math.max(250,V3.dist*pd/d))}pd=d;draw3D();return}
    const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};
    if(mode==='rot'){V3.th+=dx*0.006;V3.ph=Math.min(1.45,Math.max(0.08,V3.ph-dy*0.005))}
    else if(mode==='pan'){const k=V3.dist/800;const s=Math.sin(V3.th),c=Math.cos(V3.th);V3.tx+=(-s*dx-c*dy)*k;V3.tz+=(c*dx-s*dy)*k}
    draw3D()});
  const up=e=>{P.delete(e.pointerId);if(P.size<2)pd=0;if(!P.size)mode=null};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();V3.dist=Math.min(2600,Math.max(250,V3.dist*Math.exp(e.deltaY*0.0012)));draw3D()},{passive:false});
}
function setView(v){
  const stg=$('#stage');stg.classList.remove('m-2d','m-3d','m-split');stg.classList.add('m-'+v);
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)));
  V3.on=v!=='2d';try{localStorage.setItem(KEY+'-view',v)}catch(e){}
  requestAnimationFrame(()=>{syncAspect();render();if(V3.on){if(init3D()){size3D();build3D()}}});
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#v3-walls').onclick=()=>{V3.low=!V3.low;$('#v3-walls').setAttribute('aria-pressed',String(V3.low));build3D()};
$('#v3-top').onclick=()=>{V3.ph=0.06;V3.th=Math.PI/2;V3.dist=1350;V3.tx=291;V3.tz=335;draw3D()};
$('#v3-persp').onclick=()=>{V3.ph=0.9;V3.th=2.2;V3.dist=1550;V3.tx=291;V3.tz=335;draw3D()};
(async()=>{try{if(!window.claude||typeof window.claude.use!=='function')return;const dl=await window.claude.use('downloads');if(!dl)return;const b=$('#v3-png');b.hidden=false;b.onclick=async()=>{if(!V3.inited)return;draw3D();await new Promise(r=>setTimeout(r,60));V3.ren.render(V3.scene,V3.cam);V3.ren.domElement.toBlob(async blob=>{try{await dl.save({filename:'plan-3d.png',data:blob})}catch(e){if(e&&e.code!=='declined')toast('Не получилось сохранить картинку')}},'image/png')}}catch(e){}})();

/* ---------- Старт ---------- */
function start(saved){
  if(RO){['#tools','#b-undo','#toolOpts'].forEach(q=>{const e=$(q);if(e){(q==='#b-undo'?e.parentElement:e).hidden=true}});document.body.classList.add('ro')}
  st=migrate(saved||JSON.parse(SAVED_PLAN));
  if(!st.pipes)st.pipes=[];if(!st.measures)st.measures=[];if(!st.strokes)st.strokes=[];
  hist=[snap()];
  fitVB();renderLayers();setTool('select');refreshSide();render();
  new ResizeObserver(()=>{syncAspect();render()}).observe(svg);
  cloudInit();
  let vw='2d';try{vw=localStorage.getItem(KEY+'-view')||'2d'}catch(e){}
  if(vw!=='2d')setView(vw);
}
window.claude?.hot?.snapshot?.(()=>({st,ui:{tab:ui.tab,layers:ui.layers}}));
const boot=d=>{start(d&&d.st?d.st:null);if(d&&d.ui){Object.assign(ui,{tab:d.ui.tab||ui.tab,layers:d.ui.layers||ui.layers});renderLayers();refreshSide();render()}};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
